# The town as a service. See docs/deploy.md.
#
#   docker compose --profile ollama up -d      # the living town + its model server (Ollama) on this machine
#   docker compose up -d                       # the town alone: the offline mock, or a model server elsewhere
#
# With the ollama profile, put this in a .env file next to this file (it is git-ignored):
#   TOWN_MODE=town
#   TOWN_CONFIG=configs/town_live.yaml         # or configs/town_live_25.yaml
#   HEARTHSIDE_LLM_URL=http://ollama:11434
#   HEARTHSIDE_PASSWORD=choose-one
#   HEARTHSIDE_SPECTATORS=1
# The town downloads its models into the Ollama container on first start and continues the same
# town after every restart. A model server on another machine: the same .env without the profile
# and with HEARTHSIDE_LLM_URL=http://that-machine:11434.
services:
  town:
    build:
      context: .
      args:
        EXTRAS: ${EXTRAS:-viewer}
    image: hearthside:latest
    command: ["${TOWN_MODE:-play}"]
    ports:
      - "${HEARTHSIDE_PORT:-8080}:8080"
    environment:
      TOWN_CONFIG: ${TOWN_CONFIG:-configs/town_mock.yaml}
      TOWN_SPEED: ${TOWN_SPEED:-normal}
      TOWN_ARGS: ${TOWN_ARGS:-}
      HEARTHSIDE_PASSWORD: ${HEARTHSIDE_PASSWORD:-}
      HEARTHSIDE_SPECTATORS: ${HEARTHSIDE_SPECTATORS:-}
      HEARTHSIDE_LLM_URL: ${HEARTHSIDE_LLM_URL:-}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - town-data:/data
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}      # requests answered at once; match engine.parallel_calls
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}   # the 8B, the 3B and the embedding model stay loaded
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-models:/root/.ollama
    # NVIDIA GPU: install the NVIDIA Container Toolkit and uncomment the next four lines.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

volumes:
  town-data:
  ollama-models:
