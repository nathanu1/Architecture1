# Publishes "the town in a tab" (docs/tab.md) as a static site on GitHub Pages: a page anyone can
# open, where the town's engine and the residents' model run on the visitor's own device.
#
# It runs only when you ask for it:
#   * Actions tab -> "Publish the town in a tab" -> Run workflow, or
#   * push a tag that starts with "site-", for example:  git tag site-1 && git push origin site-1
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish the town in a tab

on:
  workflow_dispatch:
  push:
    tags: ["site-*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the page, the Python runtime and the engine
        working-directory: frontend
        run: |
          npm ci
          npm run test:tab
          npm run build:tab
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-tab

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
