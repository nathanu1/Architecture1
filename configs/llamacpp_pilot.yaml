# Zero-cost research pilot on a CPU-only machine: the paper's three-agent base (Isabella,
# Maria, Klaus) on Llama 3.2 3B served by llama-cpp-python, with real sentence embeddings
# (all-MiniLM-L6-v2, 384 dimensions) computed in process. No API key and no charges.
#
#   pip install 'llama-cpp-python[server]'           # builds llama.cpp for your CPU
#   python -m llama_cpp.server --model Llama-3.2-3B-Instruct-Q4_K_M.gguf \
#       --model_alias llama3.2-3b-q4 --n_ctx 8192 --n_threads 4 --port 8088
#   uv sync --extra local-embeddings
#   ga run --config configs/llamacpp_pilot.yaml --run-id llama-morning
#
# llama-cpp-python's server takes the output schema as {"type": "json_object", "schema": ...},
# hence schema_format. llama.cpp's own llama-server and LM Studio use the default json_schema.
# Measured on four Xeon cores (docs/experiments/round2.md): about 45 prompt tokens and 7 output
# tokens per second.
run:
  name: pilot3-llamacpp
  label: "llama.cpp pilot (Llama 3.2 3B, local)"
scenario:
  path: scenarios/pilot3/scenario.yaml
  start: "2023-02-13T07:00:00"
  end: "2023-02-13T10:00:00"
output:
  checkpoint_every_steps: 30
providers:
  llm:
    kind: openai_compatible
    model: llama3.2-3b-q4
    base_url: http://127.0.0.1:8088/v1
    schema_format: json_object
    max_output_tokens: 768
    temperature: 0.7
    timeout_s: 900
    max_retries: 2
  embeddings:
    kind: sentence-transformers
    model: sentence-transformers/all-MiniLM-L6-v2
    dims: 384
budget:
  max_calls: 40000
  max_input_tokens: null
  max_output_tokens: null
  max_runtime_s: null
