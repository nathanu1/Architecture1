# The living town: ten residents on a local Llama, built to stay on for weeks.
#
# One command starts or continues it (it checks the model server and downloads the models):
#   ga town                       # this config, on this machine, opened in the browser
#   ga town --app                 # in its own window
#   ga town --residents 25        # all 25 residents (town_live_25.yaml)
#   ga town --host 0.0.0.0        # serve other machines; set HEARTHSIDE_PASSWORD and HEARTHSIDE_SPECTATORS=1
#   HEARTHSIDE_LLM_URL=http://gpu-box:11434 ga town    # the model server is another machine
#   ga bench                      # measure your model server and see how fast the town will run
#
# What keeps it cheap enough to leave on (docs/deploy.md has the measurements):
# * the mechanical three quarters of calls go to a small model (task_overrides, from town_n25_server);
# * a situation a resident has already settled is answered from the ledger: exact prompt repeats
#   (memoize_tasks) and recurring structured situations (habit_tasks);
# * an observation a resident already waved through is not deliberated again for an hour
#   (reaction.salience_gate); every skipped one is logged;
# * residents think in parallel rounds (engine.parallel_calls), so a server with parallel slots is used;
# * forgetting keeps retrieval bounded as memory streams grow (nothing is deleted);
# * the end date is far away; a restart continues the same town and re-uses every recorded call.
# Each switch is its own row in the run's fidelity table (class X), so a study can turn one off.
extends: town_n25_server.yaml
run:
  name: town-live
  label: "live town, ten residents"
scenario:
  population: [isabella_rodriguez, maria_lopez, klaus_mueller, sam_moore, wolfgang_schulz, tom_moreno, jane_moreno, tamara_taylor, carmen_ortiz, ayesha_khan]
  start: "2023-02-13T07:00:00"
  end: "2023-06-01T00:00:00"
output:
  checkpoint_every_steps: 30
  snapshots: [initial]
retrieval:
  forgetting: {enabled: true, decay: 0.5, threshold: -1.0, importance_bonus: 0.1}
providers:
  llm:
    memoize_tasks: [choose_location, importance, importance_batch, action_grounding]
    habit_tasks: [choose_location, importance, importance_batch, action_grounding]
reaction:
  salience_gate: true
  routine_cooldown_minutes: 60
engine:
  parallel_calls: 4                          # match the model server's parallel slots (OLLAMA_NUM_PARALLEL)
budget:
  max_calls: 50000000
